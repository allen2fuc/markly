name: Docker Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: allen2fuc/markly

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cross-border connections from GitHub-hosted runners to Aliyun's
      # Hangzhou registry are prone to transient TLS handshake timeouts.
      # Retry a few times with backoff instead of failing the whole run
      # on a single blip.
      - name: Log in to Aliyun Container Registry (with retry)
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            echo "::group::Login attempt $i"
            if echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Login attempt $i failed, retrying in $((i*10))s..."
            sleep $((i*10))
          done
          echo "::error::Docker login failed after 5 attempts"
          exit 1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (with retry)
        run: |
          TAG_ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] && TAG_ARGS="$TAG_ARGS -t $t"
          done <<< "${{ steps.meta.outputs.tags }}"

          for i in 1 2 3; do
            echo "::group::Build/push attempt $i"
            if docker buildx build --push $TAG_ARGS .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Build/push attempt $i failed, retrying in $((i*15))s..."
            sleep $((i*15))
          done
          echo "::error::Build and push failed after 3 attempts"
          exit 1

name: Docker Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: allen2fuc/markly

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check ACR secrets are set
        run: |
          if [ -z "${{ secrets.ACR_USERNAME }}" ]; then echo "::error::ACR_USERNAME secret is empty or not set"; exit 1; fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then echo "::error::ACR_PASSWORD secret is empty or not set"; exit 1; fi
          echo "ACR_USERNAME length: ${#ACR_USERNAME}"
          echo "ACR_PASSWORD length: ${#ACR_PASSWORD}"
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
